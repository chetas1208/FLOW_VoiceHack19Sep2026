apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: flow-api
  namespace: flow
  labels:
    app.kubernetes.io/part-of: flow
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: flow-api}
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: {name: cpu, target: {type: Utilization, averageUtilization: 70}}
  behavior:
    # Scale down slowly: every removed pod drops its WebSocket clients.
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - {type: Pods, value: 1, periodSeconds: 120}
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - {type: Pods, value: 2, periodSeconds: 60}
