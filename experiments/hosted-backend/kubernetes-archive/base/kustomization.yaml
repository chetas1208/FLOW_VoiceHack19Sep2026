apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: flow
resources:
  - ../core
  - api-deployment.yaml
  - worker-deployment.yaml
  - service.yaml
  - ingress.yaml
  - hpa.yaml
  - keda-scaledobject.yaml
  - pdb.yaml
  - networkpolicy-app.yaml
# Pin the real tag (or better, digest) in the overlay; `latest` is rejected by scripts/lint_k8s.py.
images:
  - name: ghcr.io/chetas1208/flow-cloud
    newTag: "0.2.0"
