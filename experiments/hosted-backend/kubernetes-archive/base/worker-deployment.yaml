# Background job worker. Replica count is owned by the KEDA ScaledObject (keda-scaledobject.yaml).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: flow-worker
  namespace: flow
  labels: &labels
    app.kubernetes.io/name: flow-cloud
    app.kubernetes.io/component: worker
    app.kubernetes.io/part-of: flow
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      app.kubernetes.io/name: flow-cloud
      app.kubernetes.io/component: worker
  template:
    metadata:
      labels: *labels
    spec:
      serviceAccountName: flow-cloud
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: worker
          image: ghcr.io/chetas1208/flow-cloud:0.2.0
          imagePullPolicy: IfNotPresent
          command: [python, -m, services.flowcloud.worker]
          envFrom:
            - configMapRef: {name: flow-cloud-config}
          env:
            - {name: DATABASE_URL, valueFrom: {secretKeyRef: {name: flow-cloud-secrets, key: DATABASE_URL}}}
            - {name: REDIS_URL, valueFrom: {secretKeyRef: {name: flow-cloud-secrets, key: REDIS_URL}}}
            - {name: FLOW_JWT_KEYS, valueFrom: {secretKeyRef: {name: flow-cloud-secrets, key: FLOW_JWT_KEYS}}}
          resources:
            requests: {cpu: 100m, memory: 192Mi}
            limits: {cpu: 500m, memory: 384Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            capabilities: {drop: [ALL]}
            seccompProfile: {type: RuntimeDefault}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 64Mi}
