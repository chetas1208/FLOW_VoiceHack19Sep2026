apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: flow-migrate-egress
  namespace: flow
  labels:
    app.kubernetes.io/part-of: flow
spec:
  podSelector:
    matchLabels: {app.kubernetes.io/name: flow-cloud, app.kubernetes.io/component: migrate}
  policyTypes: [Egress]
  egress:
    # Managed PostgreSQL only. Narrow the CIDRs in the overlay.
    - to:
        - ipBlock: {cidr: 10.0.0.0/8}
        - ipBlock: {cidr: 172.16.0.0/12}
        - ipBlock: {cidr: 192.168.0.0/16}
      ports:
        - {protocol: TCP, port: 5432}
